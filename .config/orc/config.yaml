# Optional global appearance; workspace orchestration stays in orc.yaml.
# Omitted values use Orc's defaults. Reopen jump after changes, and run
# `orc ctl attention load` to refresh tmux's palette and state icons.
jump:
  view: panes
  width: "70%"
  height: "80%"
  preview: true
  exclude_sessions: "phone-*"
attention:
  clear_delay: 4s
  clear_on_view: true
  tab_mode: preserve
appearance:
  theme: catppuccin-mocha
