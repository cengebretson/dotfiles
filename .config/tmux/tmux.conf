####
#### graphics passthrough ####
####

# Allow Kitty graphics protocol (and other terminal escape sequences) to pass
# through tmux to the outer terminal — required for chafa pixel rendering.
set -g allow-passthrough on

####
#### rebindings ####
####

# for quick reload of config. Sourcing tmux.conf is sufficient: its tail already
# re-runs TPM, re-sources the active appearance, and re-runs battery.tmux, so
# repeating those here only duplicated the work.
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; refresh-client -S \; display-message "  config reloaded"

# Explicitly keep the native tmux command prompt available after config reloads.
bind : command-prompt

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space

# new window with name prompt
bind c display-popup -E -w 40% -h 3 -T " Create New Window " -S "fg=#fab387" "bash -c 'read -p \"  Window name: \" name && [ -n \"\$name\" ] && tmux new-window -n \"\$name\" -c \"#{pane_current_path}\"'"

# open splits in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# cycle windows
bind -n M-l next-window
bind -n M-h previous-window

# force a redraw of the focused pane (fixes desynced TUI input, e.g. Claude in tmux)
# sends the app its own clear-screen (C-l) directly, bypassing the vim-tmux-navigator
# C-l binding — a proper clear+repaint, not a dirty SIGWINCH repaint that stacks frames
bind -n M-r send-keys C-l \; display-message "↻ clear sent"

####
#### options ###
####

set -g popup-border-lines heavy

# NOTE: status-interval is deliberately NOT set here. 15 is tmux's stock
# default, and tmux-sensible's guard is `is the value still 15?` — so setting it
# to 15 before TPM loads reads as "untouched" and sensible overrides it to 5.
# It is set after the TPM run at the bottom of this file instead.
set -g escape-time 0
set -g repeat-time 350
set -g display-time 1500
set -g history-limit 50000

# set focus events on for nvim
set -g focus-events on

# options for color ####
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",ghostty:Tc:Ms=\\E]52;%p1%s;%p2%s\\007"
# Pass OSC 8 hyperlinks through to the outer terminal (Ghostty supports them).
# Without this tmux strips them, so clickable links never reach the terminal.
set -ag terminal-features "*:hyperlinks"
# Synchronized output (mode 2026): flicker-free full-screen redraws (Neovim, scrolling).
set -ag terminal-features "*:sync"
# Styled underlines: curly/undercurl + colored underlines (Neovim/LSP diagnostics).
set -ag terminal-features "*:usstyle"

# options for indexes for window/session creation ###
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# When a second client (e.g. Moshi on the phone) views the same window, size the
# shared window to the smallest active client so the phone view wins instead of
# cropping a laptop-sized pane. With aggressive-resize below, a window only
# viewed on one client still sizes to that client.
set -g window-size smallest

# Only resize a window based on clients that are actively viewing that window,
# not every client attached to the session group.
setw -g aggressive-resize on

# Single source of truth for "is this client the phone?". A client strictly
# narrower than this is treated as the phone everywhere: it gets the collapsed
# status bar (appearance2.conf) AND is bounced onto a grouped phone-* mirror
# (phone_autoview.sh). Keep these in lockstep via this one option so there is no
# width band that gets phone chrome but still clobbers the laptop's view.
set -g @phone_max_cols 80

####
#### improved copy mode ####
####

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
set -g copy-mode-match-style "bg=#313244,fg=#cba6f7"
set -g copy-mode-current-match-style "bg=#cba6f7,fg=#1e1e2e"
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

#####
##### Display Popups ##### 
#####

# lazygit
bind y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

# new session
bind S display-popup -E -w 40% -h 3 -T " Create New Session " -S "fg=#fab387" "bash -c 'read -p \"  Session name: \" name && [ -n \"\$name\" ] && tmux new-session -d -s \"\$name\" -c \"#{pane_current_path}\" && tmux switch-client -t \"\$name\"'"


#####
##### Display Menu ##### 
#####


#####
##### Bootstrap Plugins ##### 
#####

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'cengebretson/tmux-which-key'   ## C-k, or prefix + Space
set -g @plugin 'cengebretson/tmux-fzf-jump'
set -g @plugin 'cengebretson/tmux-attention'
set -g @plugin 'cengebretson/tmux-moshi'

# tmux-attention: clear attention markers 4s after viewing (default 8)
set -g @tmux_attention_clear_delay "4"
# Preserve useful window names while appending semantic Jira/worktree context.
set -g @tmux_attention_tab_mode "smart"
# (@tmux_attention_context is no longer set here — since v0.6.0 the plugin's own
# set-if-unset default is byte-identical to the value this file used to pin.)

# tmux-which-key: keep config.yaml out of the TPM-managed plugin directory so a
# plugin update or fresh clone cannot discard local menu customizations. The
# path is relative to XDG_CONFIG_HOME/XDG_DATA_HOME and must be set before TPM
# loads the plugin:
#   config -> ~/.config/tmux/which-key/config.yaml   (tracked in dotfiles)
#   init   -> ~/.local/share/tmux/which-key/init.tmux (generated, not tracked)
set -g @tmux-which-key-xdg-enable 1
set -g @tmux-which-key-xdg-plugin-path tmux/which-key

####
#### Configure Themes ####
####

# Toggle between appearance.conf and appearance2.conf
bind T run-shell "~/.config/tmux/scripts/toggle_theme.sh" \; source-file ~/.config/tmux/tmux.conf \;

# appearance.conf is a symlink to whichever theme is active. It is machine-local
# (gitignored), so a fresh clone has none and every source-file below would error
# out, leaving the session with no theme at all. Create it on first start,
# defaulting to appearance2. Also self-heals if the symlink is ever removed.
if-shell '[ ! -e ~/.config/tmux/appearance.conf ]' \
    'run-shell "ln -s ~/.config/tmux/appearance2.conf ~/.config/tmux/appearance.conf"'

# Load the active appearance before TPM so Catppuccin sees the custom options.
source-file ~/.config/tmux/appearance.conf

# Moshi agent-hook indicator + toggle (prefix N, left-click, right-click menu) and
# the @moshi_paired pairing seed are provided by the cengebretson/tmux-moshi plugin
# (loaded via TPM above). The indicator is spliced into appearance1/2.conf as
# #{E:@moshi_status}. Plugin defaults match the previous inline setup; override the
# @moshi_* options here if the daemon or toggle command ever change.

# Initialize TMUX plugin manager.
run '~/.config/tmux/plugins/tpm/tpm'

# Override plugin defaults that can't be set before plugin init
set -g window-status-bell-style "none"
# tmux-sensible forces status-interval to 5 whenever it still reads as tmux's
# default of 15, so the intended value has to be (re)asserted after TPM.
set -g status-interval 15

# Re-apply the active appearance after plugin init. Some status plugins touch
# status-left/status-right while loading, and the local appearance is the final
# source of truth for those bars.
source-file ~/.config/tmux/appearance.conf
# tmux-battery rewrites its #{battery_*} placeholders in status-left/right.
# Re-run it after the final appearance source so appearance1's battery module
# contains its icon and percentage instead of an empty colored block.
run-shell '~/.config/tmux/plugins/tmux-battery/battery.tmux'
# fzf-jump without prefix: Option-J opens everything, Shift-Option-J opens the
# panes that currently have tmux-attention markers.
#
# These deliberately pass no positional arguments. select_pane.sh falls back to
# the same defaults.sh values that the plugin's own `prefix + j` binding
# resolves, so all three entry points stay identical instead of drifting the
# moment an @fzf_pane_switch_* option is tuned.
bind -n M-j run-shell "~/.config/tmux/plugins/tmux-fzf-jump/select_pane.sh"
bind -n M-J run-shell "~/.config/tmux/plugins/tmux-fzf-jump/select_pane.sh --view attention"

# prefix + F: orc's own "which ticket needs me", ranked by workflow priority.
# Narrower than M-J on purpose — that covers every pane on the server and needs
# nothing installed, while this one only knows orc-managed sessions. Prefixed
# rather than bare so the reflex key stays M-J. The script reports what is
# missing when orc or a workspace is absent, instead of failing opaquely.
bind F run-shell "~/.config/tmux/scripts/orc_focus.sh"

# Tap the status-left (session / prefix area) to open the normal fzf-jump picker.
# Option-tap opens its attention-only agent queue. Both honor
# @fzf_pane_switch_exclude-sessions (hides phone-* mirrors), and both mirror the
# M-j and M-J bindings above.
unbind -n S-MouseDown1StatusLeft
bind -n MouseDown1StatusLeft run-shell "~/.config/tmux/plugins/tmux-fzf-jump/select_pane.sh"
bind -n M-MouseDown1StatusLeft run-shell "~/.config/tmux/plugins/tmux-fzf-jump/select_pane.sh --view attention"

# Hide the ephemeral grouped "phone-*" mirror sessions (created below) from the
# fzf-jump picker. The plugin's exclude filter is generic; this sets the policy.
set -g @fzf_pane_switch_exclude-sessions "phone-*"

# Phone auto-view: when a narrow (phone) client attaches OR switches to a real
# session (e.g. picking one from fzf-jump), transparently move it onto a grouped
# "phone-<session>" mirror so it shares the windows but keeps its own size, never
# reshaping the laptop's view; reap the mirror when the phone detaches. Detection
# keys on full-terminal width (portable across machines) in phone_autoview.sh.
# client-session-changed is what catches picker jumps (switch-client), so the
# phone can never sit directly on a real session. The guard stops `prefix r`
# reloads from stacking duplicate hooks, since set-hook -ga appends each run; it
# also preserves the existing tmux-attention hooks instead of replacing them.
if -F '#{!=:#{@phone_autoview_installed},1}' {
    set-hook -ga client-attached 'run-shell -b "~/.config/tmux/scripts/phone_autoview.sh #{client_name} #{client_width} #{client_session}"'
    set-hook -ga client-session-changed 'run-shell -b "~/.config/tmux/scripts/phone_autoview.sh #{client_name} #{client_width} #{client_session}"'
    set-hook -ga client-detached 'run-shell -b "~/.config/tmux/scripts/phone_autoview_cleanup.sh"'
    set -g @phone_autoview_installed 1
}

# Connection indicator: record whether the attached client came in over SSH
# (remote) vs a local terminal, into @conn_type for the status bar. Same
# install-guard pattern as the phone hooks so `prefix r` does not stack copies.
set -g @conn_type local
if -F '#{!=:#{@conn_type_installed},1}' {
    set-hook -ga client-attached 'run-shell -b "~/.config/tmux/scripts/conn_type.sh #{client_session}"'
    set-hook -ga client-session-changed 'run-shell -b "~/.config/tmux/scripts/conn_type.sh #{client_session}"'
    set -g @conn_type_installed 1
}
