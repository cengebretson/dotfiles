set -g @catppuccin_flavor "frappe"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=default,fg=#{@thm_green}]  #S "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#{?client_prefix,#[bg=default fg=#{@thm_red} bold]  PREFIX ,#{?#{==:#{pane_mode},copy-mode},#[bg=default fg=#{@thm_yellow}] 󰆏 COPY ,}}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
# Hide all right-side modules on clients narrower than @phone_max_cols, matching
# appearance2's phone layout. The width check is evaluated per client.
# Remote-connection indicator: 󰚥 + host, only when attached over SSH
# (@conn_type maintained by scripts/conn_type.sh via client hooks in tmux.conf).
# Mirrors appearance2 so the feature survives a theme toggle.
set -ga status-right "#{?#{e|>=:#{client_width},#{@phone_max_cols}},#{?#{==:#{@conn_type},remote},#[bg=default fg=#{@thm_peach}] 󰚥 #h #[bg=default fg=#{@thm_overlay_0} none]│,},}"
set -ga status-right "#{?#{e|>=:#{client_width},#{@phone_max_cols}},#{?#{e|>=:10,#{battery_percentage}},#[bg=#{@thm_red} fg=#{@thm_bg}],#[bg=default fg=#{@thm_pink}]} #{battery_icon} #{battery_percentage} #[bg=default fg=#{@thm_overlay_0} none]│,}"
# Moshi agent-hook daemon indicator — provided by the tmux-moshi plugin. The
# #{E:@moshi_status} format carries its own range=user wrapper, so left-click,
# right-click menu, and prefix N all work without inline bindings here.
set -ga status-right "#{?#{e|>=:#{client_width},#{@phone_max_cols}},#[bg=default] #{E:@moshi_status} #[bg=default fg=#{@thm_overlay_0} none]│,}"
set -ga status-right "#{?#{e|>=:#{client_width},#{@phone_max_cols}},#[bg=default fg=#{@thm_blue}]  #{=/-40/...:#{E:@tmux_attention_context}} ,}"

# Configure Tmux
set -g status-position top
set -g status-style "bg=default"
set -g status-justify "absolute-centre"

# command line and status-message look and feel
# This file is sourced once before Catppuccin initializes, so only force-expand
# its palette after the theme variables exist. It is sourced again after TPM.
if -F '#{!=:#{@thm_surface_1},}' {
    set -gF message-style "bg=#{@thm_surface_1}, fg=#{@thm_fg}, bold"
    set -gF message-command-style "bg=#{@thm_surface_1}, fg=#{@thm_fg}, bold"
}
set -g message-format "#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}},fill=#45475a]#{message}"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=default,fg=#{@thm_peach}"
setw -g pane-border-style "bg=default,fg=#{@thm_overlay_2}"
setw -g pane-border-lines single

# window style
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator "#[fg=#{@thm_overlay_1},bg=default]│"
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style 'custom'
set -gu @catppuccin_window_flags
set -g @catppuccin_window_number ""
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_text_color "default"
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=default]#{?#{!=:#{E:@tmux_attention_tab_icon},},#{E:@tmux_attention_tab_icon} ,#(~/.config/tmux/scripts/custom_number.sh '#I' 'dsquare')}#{?#{!=:#{E:@tmux_attention_tab_label},},#{E:@tmux_attention_tab_label},}#{?window_bell_flag, #[fg=#{@thm_red}]󰂞,}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}]#{?#{!=:#{E:@tmux_attention_tab_icon},},#{E:@tmux_attention_tab_icon} ,#(~/.config/tmux/scripts/custom_number.sh '#I' 'msquare')}#{?#{!=:#{E:@tmux_attention_tab_label},},#{E:@tmux_attention_tab_label},}"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_peach},bg=default]▐"
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_peach},bg=default]▌"
