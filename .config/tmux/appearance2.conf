# Configure battery
set -g @batt_icon_charge_tier8 '󰂂'
set -g @batt_icon_charge_tier7 '󰂁'
set -g @batt_icon_charge_tier6 '󰂀'
set -g @batt_icon_charge_tier5 '󰁿'
set -g @batt_icon_charge_tier4 '󰁾'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier2 '󰁻'
set -g @batt_icon_charge_tier1 '󰁺'
set -g @batt_icon_status_charged '󰁹'
set -g @batt_icon_status_charging '󰂄'
set -g @batt_icon_status_discharging '󰂃'
set -g @batt_icon_status_attached '󰂄'
set -g @batt_icon_status_unknown '󰂄'

set -g @batt_color_charge_primary_tier8 "#{E:#{@orc_color_mauve}}"
set -g @batt_color_charge_primary_tier7 "#{E:#{@orc_color_mauve}}"
set -g @batt_color_charge_primary_tier6 "#{E:#{@orc_color_mauve}}"
set -g @batt_color_charge_primary_tier5 "#{E:#{@orc_color_mauve}}"
set -g @batt_color_charge_primary_tier4 "#{E:#{@orc_color_mauve}}"
set -g @batt_color_charge_primary_tier3 "#{E:#{@orc_color_pink}}"
set -g @batt_color_charge_primary_tier2 "#{E:#{@orc_color_yellow}}"
set -g @batt_color_charge_primary_tier1 "#{E:#{@orc_color_red}}"

set -g @batt_color_status_primary_charged "#{E:#{@orc_color_mauve}}"
set -g @batt_color_status_primary_charging "#{E:#{@orc_color_mauve}}"
set -g @batt_color_status_primary_discharging "#{E:#{@orc_color_red}}"
set -g @batt_color_status_primary_attached "#{E:#{@orc_color_mauve}}"
set -g @batt_color_status_primary_unknown  "#{E:#{@orc_color_mauve}}"
set -g @batt_percentage_format "%03d%%"

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none" # none == default
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Style
set -g @custom_status_separator "#[fg=#{@orc_color_surface2},bg=default,none]"
set -g @custom_status_inline "󰇝"
set -g @custom_text "#[fg=#{@orc_color_subtext0}]"

# status left look and feel
set -g status-left-length 80
set -g status-left ""

# status left modules
# Keep the session name visible at every client width so the mobile bar retains
# the same orientation context as the desktop bar.
set -ga status-left "#{?client_prefix,#[bg=#{@orc_color_green} fg=#{@orc_color_base} bold] 󰐱 #S #[default],#[fg=#{@orc_color_green}] 󰐱 #S }#[fg=#{@orc_color_overlay1} nobold]│ "

# status right look and feel
set -g status-right-length 160
set -g status-right ""

# status right modules
# Heavy modules (remote host, project path, Moshi) render only on clients >= @phone_max_cols
# wide (set in tmux.conf), so a narrow client (e.g. the phone over Moshi) keeps
# the row for the window list. Width is per-client via the shared option so this
# gate and the phone-mirror logic never drift: #{e|>=:#{client_width},#{@phone_max_cols}}.

set -ga status-right "#{?#{==:#{pane_mode},copy-mode},#[fg=#{@orc_color_yellow}] 󰆏 COPY ,}"
# Remote-connection indicator: shown only when the attached client came in over
# SSH (@conn_type == remote, maintained by scripts/conn_type.sh via client hooks
# in tmux.conf). #h is the host this tmux server runs on. Nothing renders when
# local. Gated to full-width clients (>= @phone_max_cols) like the other heavy
# modules, so it stays off the trimmed-down phone bar. Swap 󰚥 if your font
# lacks it.
set -ga status-right "#{?#{e|>=:#{client_width},#{@phone_max_cols}},#{?#{==:#{@conn_type},remote},#[fg=#{@orc_color_peach}]#{E:#{@custom_status_inline}} 󰚥 #{E:#{@custom_text}}#h ,},}"
set -ga status-right "#{?#{e|>=:#{client_width},#{@phone_max_cols}},#[fg=#{@orc_color_blue}]#{E:#{@custom_status_inline}} 󰉋 #{E:#{@custom_text}}#{E:@orc_attention_context} ,}"
# Moshi agent-hook daemon indicator — provided by the tmux-moshi plugin
# (#{E:@moshi_status} carries its own range=user wrapper). Shown only on wide
# clients; the phone bar hides it via the @phone_max_cols gate.
set -ga status-right "#{?#{e|>=:#{client_width},#{@phone_max_cols}},#{E:#{@custom_status_separator}}#[fg=#{@orc_color_overlay1}]#{E:#{@custom_status_inline}} #{E:@moshi_status} #[default],}"
# set -ga status-right "#{battery_color_fg}#[bg=default]#{E:#{@custom_status_inline}} #{battery_icon} #{E:#{@custom_text}}#{battery_percentage} "

# Configure Tmux
set -g status-position top
set -g status-style "bg=default"
set -g status-justify "left"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "fg=#{@orc_color_peach},bg=default"
setw -g pane-border-style "fg=#{@orc_color_overlay2},bg=default"
setw -g pane-border-lines single

# command line look and feel
# This file is sourced once before Catppuccin initializes, so only force-expand
# its palette after the theme variables exist. It is sourced again after TPM.
if -F '#{!=:#{@orc_color_surface1},}' {
    set -gF message-style "bg=#{@orc_color_surface1}, fg=#{@orc_color_text}, bold"
    set -gF message-command-style "bg=#{@orc_color_surface1}, fg=#{@orc_color_text}, bold"
}
set -g message-format "#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}},fill=#{@orc_color_surface1}]#{message}"

# window status (managed by catppuccin)
set -gF window-status-separator "#[fg=#{@orc_color_overlay1}]󰇝"
set -g @catppuccin_window_status_style "custom"
set -gu @catppuccin_window_flags
set -g @catppuccin_window_number ""
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_number_color "default"
set -g @catppuccin_window_text_color "default"
# Keep inactive tabs the same width as the active tab, whose visible ▐ and ▌
# separators each occupy one cell.
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_right_separator " "
# Window name (#W) is dropped on narrow clients (the phone); only the number glyph
# shows, so multiple tabs fit. Gate is per-client via the shared @phone_max_cols
# option: #{e|>=:#{client_width},#{@phone_max_cols}}.
set -g @catppuccin_window_text "#[fg=#{@orc_color_rosewater},bg=default]#{?#{!=:#{E:@orc_window_icon},},#{E:@orc_window_icon} ,#(~/.config/tmux/scripts/custom_number.sh '#I' 'dsquare')}#{?#{e|>=:#{client_width},#{@phone_max_cols}},#{?#{!=:#{E:@orc_attention_tab_label},},#{E:@orc_attention_tab_label},},}#{?window_bell_flag, #[fg=#{@orc_color_red}]󰂞,}#{?window_zoomed_flag, #[fg=#{@orc_color_yellow}]󰁌,}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@orc_color_mantle},bg=#{@orc_color_peach}]#{?#{!=:#{E:@orc_window_icon},},#{E:@orc_window_icon} ,#(~/.config/tmux/scripts/custom_number.sh '#I' 'msquare')}#{?#{e|>=:#{client_width},#{@phone_max_cols}},#{?#{!=:#{E:@orc_attention_tab_label},},#{E:@orc_attention_tab_label},},}#{?window_zoomed_flag, 󰁌,}"
set -g @catppuccin_window_current_left_separator "#[fg=#{@orc_color_peach},bg=default]▐"
set -g @catppuccin_window_current_right_separator "#[fg=#{@orc_color_peach},bg=default]▌"

# set -g status-justify absolute-centre
